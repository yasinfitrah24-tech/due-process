name: due-process

x-locked-down: &locked-down
  build: ./testsite
  image: due-process-testsite
  user: "65534"
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges]
  restart: unless-stopped

services:
  app:
    build: .
    image: due-process-app
    ports: ["127.0.0.1:8000:8000"]
    env_file:
      - path: .env
        required: false
    volumes:
      - appdata:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [testsite, collector]
    restart: unless-stopped

  testsite:
    <<: *locked-down
    networks:
      sandbox:
        aliases: [tailspin-offers.test, northwind-verify.test, northwind-bank.test]

  collector:
    <<: *locked-down
    command: ["python3", "-u", "/app/collector.py"]
    networks:
      sandbox:
        aliases: [collector.test]

volumes:
  appdata:

networks:
  # Sandbox containers join this network from sandbox/launch.py. Internal: no route to the internet.
  sandbox:
    name: dp-sandbox
    internal: true
