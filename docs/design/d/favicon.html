<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Favicon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0}
.tab{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:8px 8px 0 0;font-size:13px;min-width:200px;box-sizing:border-box}
.lbl{font-size:13px;color:#555E6B;margin-top:8px}
</style>
</helmet>
<div style="width:900px;height:600px;box-sizing:border-box;padding:40px;font-family:'Source Sans 3',ui-sans-serif,system-ui,sans-serif;background:#fff;color:#111418;display:flex;flex-direction:column;gap:32px">
  <div>
    <h1 style="margin:0;font-size:28px;font-weight:800">Favicon</h1>
    <p style="margin:6px 0 0;font-size:15px;color:#555E6B">The claim and evidence mark on a navy tile, so it holds up on light and dark browser tabs. Below 32 px the halves get thicker and the gap wider.</p>
  </div>

  <div style="display:flex;gap:40px;align-items:flex-end">
    <div style="text-align:center"><svg role="img" aria-label="Favicon at 180 pixels" width="180" height="180" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#14336B"></rect><rect x="7.5" y="7.5" width="7" height="17" rx="1" fill="none" stroke="#fff" stroke-width="1.8"></rect><rect x="17.5" y="6.6" width="7.9" height="18.8" rx="1" fill="#fff"></rect></svg><div class="lbl">180, app icon</div></div>
    <div style="text-align:center"><svg role="img" aria-label="Favicon at 48 pixels" width="48" height="48" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#14336B"></rect><rect x="7.5" y="7.5" width="7" height="17" rx="1" fill="none" stroke="#fff" stroke-width="1.8"></rect><rect x="17.5" y="6.6" width="7.9" height="18.8" rx="1" fill="#fff"></rect></svg><div class="lbl">48</div></div>
    <div style="text-align:center"><svg role="img" aria-label="Favicon at 32 pixels" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#14336B"></rect><rect x="7.5" y="7.5" width="7" height="17" rx="1" fill="none" stroke="#fff" stroke-width="1.8"></rect><rect x="17.5" y="6.6" width="7.9" height="18.8" rx="1" fill="#fff"></rect></svg><div class="lbl">32</div></div>
    <div style="text-align:center"><svg role="img" aria-label="Favicon at 16 pixels" width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#14336B"></rect><rect x="3.5" y="3.5" width="3.5" height="9" fill="none" stroke="#fff" stroke-width="1.4"></rect><rect x="9" y="3" width="4" height="10" fill="#fff"></rect></svg><div class="lbl">16</div></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:16px">
    <div style="background:#DEE1E6;padding:8px 8px 0;border-radius:8px;display:flex;gap:4px">
      <div class="tab" style="background:#fff;color:#111418"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#14336B"></rect><rect x="3.5" y="3.5" width="3.5" height="9" fill="none" stroke="#fff" stroke-width="1.4"></rect><rect x="9" y="3" width="4" height="10" fill="#fff"></rect></svg>Case 33 · Due Process</div>
      <div class="tab" style="color:#3E4652">Other tab</div>
    </div>
    <div style="background:#202124;padding:8px 8px 0;border-radius:8px;display:flex;gap:4px">
      <div class="tab" style="background:#35363A;color:#E8EAED"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><rect width="16" height="16" rx="3" fill="#14336B"></rect><rect x="3.5" y="3.5" width="3.5" height="9" fill="none" stroke="#fff" stroke-width="1.4"></rect><rect x="9" y="3" width="4" height="10" fill="#fff"></rect></svg>Case 33 · Due Process</div>
      <div class="tab" style="color:#9AA0A6">Other tab</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":900,"height":600}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
