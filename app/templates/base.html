<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Due Process{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; max-width: 1000px; margin: 0 auto; padding: 16px; color: #1c2024; background: #fff; }
    header { display: flex; gap: 16px; align-items: baseline; border-bottom: 1px solid #d9dde1; margin-bottom: 16px; }
    header a { color: inherit; text-decoration: none; font-weight: 600; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e6e8eb; vertical-align: top; overflow-wrap: anywhere; }
    label { display: block; margin: 8px 0; }
    input[type=text], input[type=url], textarea { width: 100%; box-sizing: border-box; padding: 6px; font: inherit; }
    button { font: inherit; padding: 6px 14px; cursor: pointer; }
    blockquote { margin: 0; padding: 8px 12px; background: #f4f5f6; border-left: 3px solid #b8bec4; white-space: pre-wrap; overflow-wrap: anywhere; }
    img { max-width: 100%; border: 1px solid #d9dde1; }
    .error { color: #a4161a; font-weight: 600; }
    .muted { color: #5f6870; }
    .chip { display: inline-block; padding: 0 6px; border-radius: 4px; font-size: 12px; background: #e6e8eb; white-space: nowrap; }
    .chip.observed { background: #d3ecd8; }
    .chip.declared_in_script { background: #fbe7bd; }
    .chip.model_claim { background: #dcdcf7; }
    .level { font-weight: 700; }
    .level-Proven { color: #a4161a; }
    .level-Suspicious { color: #9a5b00; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
  <header><a href="/">Due Process</a><span class="muted">A report is a claim. Only evidence reproduced in a disposable browser can move an action.</span></header>
  {% block content %}{% endblock %}
</body>
</html>
