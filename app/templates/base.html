<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Due Process{% endblock %}</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/static/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/static/favicon-16.png" type="image/png" sizes="16x16">
  <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
  <link rel="preload" href="/static/fonts/source-sans-3-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/static/fonts/source-sans-3-latin-800-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="/static/htmx.min.js"></script>
  <script src="/static/js/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="site-header-in">
      <a class="brand" href="/" aria-label="Due Process, home">
        <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="3" y="4" width="12" height="26" rx="1.5" fill="none" stroke="#14336B" stroke-width="2.4"/><rect x="19" y="4" width="12" height="26" rx="1.5" fill="#14336B"/></svg>
        <span>Due Process</span>
      </a>
      <nav class="site-nav" aria-label="Main">
        <a href="/#queue"{% if request.url.path in ('/', '/reports', '/test-url') %} aria-current="page"{% endif %}>Queue</a>
        <a href="/compare"{% if request.url.path.startswith('/compare') %} aria-current="page"{% endif %}><span class="long">Same report, two pages</span><span class="short">Compare</span></a>
      </nav>
    </div>
  </header>
  <main id="main">
    {% block band %}{% endblock %}
    <div class="page">
      {% block content %}{% endblock %}
    </div>
  </main>
  <p id="live" class="sr-only" aria-live="polite"></p>
</body>
</html>
