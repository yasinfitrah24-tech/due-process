{% for c in cases %}
<tr>
  <td><a href="/cases/{{ c.id }}">#{{ c.id }}</a></td>
  <td>{{ c.url }}</td>
  <td>{{ c.customer_name }}</td>
  <td>{{ c.status }}</td>
  <td><span class="level level-{{ (c.level or '')|replace(' ', '') }}">{{ c.level or '...' }}</span></td>
  <td>{{ c.decided_action or '' }}</td>
</tr>
{% else %}
<tr><td colspan="6" class="muted">No reports yet.</td></tr>
{% endfor %}
