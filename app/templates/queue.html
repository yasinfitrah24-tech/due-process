{% extends "base.html" %}
{% block title %}Queue - Due Process{% endblock %}
{% block content %}
<h2>New report</h2>
{% if error %}<p class="error">Rejected: {{ error }}</p>{% endif %}
<form method="post" action="/reports">
  <label>Reported URL <input type="text" name="url" required placeholder="http://tailspin-offers.test/start"></label>
  <label>Claim <textarea name="claim" rows="3" required></textarea></label>
  <button type="submit">Submit report</button>
</form>

<h2>Queue</h2>
<table>
  <thead><tr><th>Case</th><th>URL</th><th>Customer</th><th>Status</th><th>Verdict</th><th>Action</th></tr></thead>
  <tbody hx-get="/partials/queue" hx-trigger="every 3s" hx-swap="innerHTML">
    {% include "_queue_rows.html" %}
  </tbody>
</table>
{% endblock %}
